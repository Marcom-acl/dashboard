name: Immatriculations LU — Mise à jour mensuelle

on:
  schedule:
    # Le 10 de chaque mois à 07:00 heure Luxembourg (06:00 UTC) — la SNCA
    # publie le nouvel export "Parc Automobile" en général entre le 1er et le 7.
    - cron: '0 6 10 * *'
  workflow_dispatch:
    # Déclenchement manuel depuis GitHub Actions pour tester

permissions:
  contents: write

jobs:
  refresh-car-registrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run car registrations refresh script
        run: python scripts/car-registrations-refresh.py

      - name: Commit updated car-registrations-data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/car-registrations-data.json
          git diff --cached --quiet || git commit -m "chore: immatriculations LU — $(date +'%Y-%m-%d')"
          git push
